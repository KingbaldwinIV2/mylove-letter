<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6b6cf">
  <title>QR — My Love Letter</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .qr-wrap{max-width:680px;margin:10vh auto 0;background:rgba(255,253,251,.96);border-radius:28px;padding:36px;box-shadow:0 20px 60px rgba(102,48,77,.14);text-align:center}
    .qr-box{display:grid;place-items:center;margin:24px auto 18px;padding:16px;background:white;border-radius:20px;width:min(340px,80vw);min-height:340px;border:1px solid rgba(122,74,97,.12)}
    .qr-box img{width:100%;height:auto;display:block}
    .url-row{display:flex;gap:10px;max-width:560px;margin:0 auto}
    input{flex:1;padding:12px 14px;border:1px solid rgba(122,74,97,.18);border-radius:12px;font:inherit}
    .hint{font-size:13px;color:#8c7180;line-height:1.7}
    .back{display:inline-block;margin-top:10px;color:#bb5c88;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main class="app">
    <section class="qr-wrap">
      <div class="tiny">A LITTLE GIFT</div>
      <h1>Scan to read my letter ♡</h1>
      <p class="hint">Paste the public URL of this site's <b>index.html</b> below. The QR image will be updated instantly.</p>

      <div class="url-row">
        <input id="url" type="url" value="https://YOUR-LINK-HERE.example/love-letter/" aria-label="Public website URL">
        <button id="make" class="nav-btn primary" type="button">Make QR</button>
      </div>

      <div class="qr-box">
        <div id="qrcode"></div>
      </div>

      <a class="back" href="index.html">Open the letter on this device →</a>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const url = document.getElementById('url');
    const box = document.getElementById('qrcode');

    function makeQR(){
      box.innerHTML = '';
      const value = url.value.trim();
      new QRCode(box, {
        text: value,
        width: 300,
        height: 300,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    document.getElementById('make').addEventListener('click', makeQR);
    makeQR();
  </script>
</body>
</html>
